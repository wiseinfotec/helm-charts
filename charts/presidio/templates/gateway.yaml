{{- if .Values.gateway.enabled -}}
{{- $fullname := include "presidio.fullname" . -}}
{{- $gatewayName := printf "%s-gateway" $fullname | trunc 63 | trimSuffix "-" -}}
{{- $gatewayLabels := merge (dict) .Values.gateway.labels .Values.commonLabels -}}
{{- $gatewayAnnotations := merge (dict) .Values.gateway.annotations .Values.commonAnnotations -}}
{{- $routeLabels := merge (dict) .Values.gateway.route.labels .Values.gateway.labels .Values.commonLabels -}}
{{- $routeAnnotations := merge (dict) .Values.gateway.route.annotations .Values.gateway.annotations .Values.commonAnnotations -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  {{- with $gatewayLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $gatewayAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.gatewayClassName is required when gateway.enabled=true" .Values.gateway.gatewayClassName }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-route" $fullname | trunc 63 | trimSuffix "-" }}
  {{- with $routeLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $routeAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  rules:
    {{- range $backend := list
      (dict "name" (include "presidio.analyzer.fullname" .) "port" .Values.analyzer.service.externalPort)
      (dict "name" (include "presidio.anonymizer.fullname" .) "port" .Values.anonymizer.service.externalPort)
      (dict "name" (include "presidio.anonymizerimage.fullname" .) "port" .Values.anonymizerimage.service.externalPort) }}
    - matches:
        - path:
            type: PathPrefix
            value: /{{ $backend.name }}
      {{- if $.Values.gateway.route.rewritePath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - name: {{ $backend.name }}
          port: {{ $backend.port }}
    {{- end }}
{{- end }}
