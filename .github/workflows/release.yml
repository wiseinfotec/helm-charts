name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Configure Git
      if: github.event_name == 'push'
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Set up Helm
      uses: Azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      with:
        version: v4.3.0

    - name: Log in to GHCR
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      run: |
        printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Run chart-releaser
      id: chart-releaser
      if: github.event_name == 'push'
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
      with:
        skip_existing: true
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: Package all charts
      if: github.event_name == 'workflow_dispatch'
      run: |
        mkdir -p .cr-release-packages
        for chart in charts/*/Chart.yaml; do
          helm package "$(dirname "$chart")" --destination .cr-release-packages
        done

    - name: Push charts to GHCR
      if: github.event_name == 'workflow_dispatch' || steps.chart-releaser.outputs.changed_charts != ''
      run: |
        for package in .cr-release-packages/*.tgz; do
          helm push "$package" oci://ghcr.io/wiseinfotec/helm-charts
        done
